version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Actions are pinned to full commit SHAs; a major bump needs a manual
    # review of the new action, not an automatic PR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
