# CI for dsh-os-suite.
#
# The suite supports Node ^22.19.0 || >=24.9.0. The test job exercises Node 24
# on Linux, Windows and macOS, plus the Node 22 lower bound on Linux. The repo
# has a committed package-lock.json, hence `npm ci` (reproducible installs,
# cached by setup-node).
#
# `dsh-smoke` is the end-to-end packaging gate: it packs the six workspaces,
# installs those tarballs into a throwaway DSH_HOME with a pinned DSH release,
# and asserts the composed web profile still names every package. It runs on
# Linux only and never reads or writes a real profile.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test / Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['24']
        include:
          - os: ubuntu-latest
            node: '22.19.0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies (npm ci)
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Check documentation state
        shell: bash
        run: |
          set -euo pipefail
          npm run check:docs

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          npm test

      # Coverage gate: run once on Linux so the three-OS matrix is not
      # re-running the same suite three times. The thresholds are the observed
      # floor with headroom (2026-11-15: lines 89.3 / funcs 89.4 / branches 77.4).
      - name: Coverage gate (Node 24, ubuntu)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        shell: bash
        run: |
          set -euo pipefail
          npm run test:coverage 2>&1 | tee coverage.txt

      - name: Upload coverage report
        if: always() && matrix.os == 'ubuntu-latest' && matrix.node == '24'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}-node-${{ matrix.node }}
          path: coverage.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Syntax check every src/*.js
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(packages/*/src/*.js)
          if ((${#files[@]} == 0)); then
            echo "::error::No packages/*/src/*.js files found"
            exit 1
          fi
          for file in "${files[@]}"; do
            node --check "$file"
          done
          echo "node --check: ${#files[@]} file(s) OK"

      # dsh-os-suite packages are library-only (no `bin`), so this step has
      # nothing to run today. It stays here so a future CLI is smoke-tested
      # automatically instead of relying on someone remembering to add it.
      - name: CLI smoke (--version / --help)
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for manifest in packages/*/package.json; do
            package_dir="$(dirname "$manifest")"
            while IFS= read -r bin; do
              [ -n "$bin" ] || continue
              count=$((count + 1))
              echo "::group::CLI smoke ${package_dir}/${bin}"
              version="$(node "${package_dir}/${bin}" --version)"
              if [ -z "$version" ]; then
                echo "::error::${package_dir}/${bin} --version printed nothing"
                exit 1
              fi
              printf 'version: %s\n' "$version"
              node "${package_dir}/${bin}" --help >/dev/null
              echo "::endgroup::"
            done < <(node -p "const b = require('./${manifest}').bin; b ? (typeof b === 'string' ? [b] : Object.values(b)).join('\n') : ''")
          done
          if [ "$count" -eq 0 ]; then
            echo "::notice::No 'bin' entry points in packages/* (library-only suite); CLI smoke has nothing to run."
          else
            echo "CLI smoke: ${count} CLI(s) OK"
          fi

      # Runs `npm pack --dry-run --json` for every package and asserts the
      # required files (src/, README, DESIGN, LICENSE, package.json).
      - name: Pack manifest smoke test
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smoke-pack.mjs

  # Mounts the real DSH 0.2.2-rc.3 service packages (Cordis, ToolRuntime,
  # NativeToolExecutor, SessionStore, SessionQuery) and checks the package
  # seams against them. No model call and no API key are involved.
  host-integration:
    name: Host services integration (Linux, Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies (npm ci)
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Run real DSH service integration tests
        shell: bash
        run: |
          set -euo pipefail
          npm run test:integration

  # End-to-end smoke against a pinned DSH release. Linux only: the profile tool
  # forwards to pnpm and the paths are POSIX. It installs from local tarballs,
  # so it exercises the publishable artifact without waiting for a release.
  dsh-smoke:
    name: DSH profile smoke (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DSH_VERSION: '0.2.2-rc.3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      # `dsh plugin` forwards to pnpm, which is not part of the runner image.
      # Pin the version the local smoke was verified with.
      - name: Install pnpm
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@12.16.1
          pnpm --version

      - name: Create throwaway DSH_HOME
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$RUNNER_TEMP/dsh-os-smoke"
          mkdir -p "$smoke_dir/tarballs"
          dsh_home="$(mktemp -d "$smoke_dir/home.XXXXXX")"
          {
            echo "SMOKE_DIR=$smoke_dir"
            echo "DSH_HOME=$dsh_home"
          } >> "$GITHUB_ENV"
          echo "DSH_HOME=$dsh_home"

      - name: npm pack the six packages
        shell: bash
        run: |
          set -euo pipefail
          for dir in packages/dsh-os-*; do
            ( cd "$dir" && npm pack --pack-destination "$SMOKE_DIR/tarballs" )
          done
          tarballs=("$SMOKE_DIR"/tarballs/*.tgz)
          if [ "${#tarballs[@]}" -ne 6 ]; then
            echo "::error::expected 6 tarballs, found ${#tarballs[@]}"
            ls -l "$SMOKE_DIR/tarballs"
            exit 1
          fi
          echo "packed ${#tarballs[@]} tarball(s)"

      - name: Install the tarballs into the temp profile
        shell: bash
        run: |
          set -euo pipefail
          log="$SMOKE_DIR/plugin-add.log"
          if ! npx --yes "@deepseek-ai/dsh@${DSH_VERSION}" plugin --profile web add "$SMOKE_DIR"/tarballs/*.tgz >"$log" 2>&1; then
            echo "::error::dsh plugin add failed; log follows"
            cat "$log"
            exit 1
          fi
          cat "$log"

      # Each installed bundle contributes one `# == <package-name>` section to
      # the dump. Assert all six names and exactly six dsh-os-* sections.
      - name: Assert the composed profile lists all six bundles
        shell: bash
        run: |
          set -euo pipefail
          dump="$SMOKE_DIR/dump-config.yml"
          if ! npx --yes "@deepseek-ai/dsh@${DSH_VERSION}" --profile web --dump-config >"$dump" 2>"$SMOKE_DIR/dump-config.err"; then
            echo "::error::dsh --dump-config failed; log follows"
            cat "$SMOKE_DIR/dump-config.err"
            exit 1
          fi

          missing=0
          for pkg in dsh-os-catalog dsh-os-eval dsh-os-lease dsh-os-quota dsh-os-registry dsh-os-trace; do
            if grep -qE "^# == ${pkg}(,|$)" "$dump"; then
              echo "ok: # == ${pkg}"
            else
              echo "::error::missing '# == ${pkg}' in --dump-config"
              missing=1
            fi
          done

          count="$(grep -cE '^# == dsh-os-' "$dump" || true)"
          echo "dsh-os-* layer sections: ${count}"
          if [ "$missing" -ne 0 ] || [ "$count" -ne 6 ]; then
            echo "::error::expected exactly six '# == dsh-os-*' sections; dump follows"
            cat "$dump"
            exit 1
          fi

      - name: Remove the throwaway DSH_HOME
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          case "${DSH_HOME:-}" in
            "$RUNNER_TEMP"/dsh-os-smoke/*) rm -rf -- "$DSH_HOME" ;;
            *) echo "not removing DSH_HOME=${DSH_HOME:-<unset>}" ;;
          esac
